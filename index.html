<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GadgetKita — Toko Aksesoris HP Terlengkap</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="description" content="Toko aksesoris HP terlengkap. Case, charger, earphone, kabel data, powerbank, pelindung layar & aksesoris gadget kualitas premium." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Syne:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      html, body, #root { height: 100%; margin: 0; padding: 0; }
      #boot-loader {
        position: fixed; inset: 0; background: #ffffff; z-index: 99999;
        display: flex; align-items: center; justify-content: center;
      }
      #boot-loader .spinner {
        width: 42px; height: 42px; border-radius: 50%;
        border: 4px solid #e5e7eb;
        border-top-color: #16a34a;
        animation: boot-spin 1s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      #boot-loader.hidden { display: none; }
    </style>
  </head>
  <body class="bg-gray-50 text-slate-900">
    <div id="boot-loader"><div class="spinner"></div></div>
    <div id="root"></div>
    <script>
      window.addEventListener('load', function () {
        setTimeout(function () {
          var el = document.getElementById('boot-loader');
          if (el) el.classList.add('hidden');
        }, 1000);
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
